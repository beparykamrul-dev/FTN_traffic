version: 1
service: ftn-ddns

modes:
  ipv4: true
  ipv6: true
  dual_stack: true
  dynamic_hostname: true
  health_failover: true
  multi_provider: true
  anycast_aware: true

update_sources:
  - authenticated_agent
  - webhook
  - dhcp_event
  - router_event
  - scheduled_probe

providers:
  - powerdns
  - technitium
  - cloudflare_dns
  - dnspod_tencent_cloud
  - akamai_dns
  - route53_aws
  - google_cloud_dns
  - azure_dns
  - duckdns
  - porkbun
  - fastly

policy:
  provider_credentials_in_git: false
  third_party_zone_changes: authorized_only
  mutation_requires_approval: true
  audit_mutations: true
  public_recursion: false

routing:
  strategy: health_based
  failover: enabled
  stale_record_protection: enabled
  ttl_bounds_seconds: [30, 86400]

observability:
  prometheus: true
  dns_query_metrics: true
  update_latency_metrics: true
  provider_health_metrics: true
