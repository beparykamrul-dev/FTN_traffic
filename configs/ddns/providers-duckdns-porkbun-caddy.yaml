version: 1
providers:
  duckdns:
    kind: dynamic_dns
    api: duckdns
    credential_ref: secret://ddns/duckdns
    supports: [A, AAAA]
    policy:
      authorization_required: true
      approval_required: true
      credentials_in_git: false

  porkbun:
    kind: authoritative_dns
    api: porkbun
    credential_ref: secret://ddns/porkbun
    supports: [A, AAAA, CNAME, TXT]
    policy:
      authorization_required: true
      approval_required: true
      credentials_in_git: false

  caddy_dns:
    kind: dns_provider_adapter
    integration: caddy-dns
    credential_ref: secret://ddns/caddy-dns
    supports: [provider_specific]
    policy:
      authorization_required: true
      approval_required: true
      credentials_in_git: false

  route53_aws:
    kind: authoritative_dns
    api: aws_route53
    credential_ref: secret://ddns/route53
    zone_id_ref: secret://ddns/route53/zone_id
    region_env: AWS_REGION
    supports: [A, AAAA, CNAME, TXT, CAA]
    policy:
      authorization_required: true
      approval_required: true
      least_privilege: true
      credentials_in_git: false
      recommended_actions:
        - route53:ChangeResourceRecordSets
        - route53:GetHostedZone
        - route53:ListResourceRecordSets

execution:
  mode: provider_neutral
  fail_closed_on_missing_credentials: true
  no_plaintext_secrets_in_logs: true
  audit_mutations: true
  idempotency_key: request_id
