version: 1
service: ftn-dns

control_plane:
  aspnet_core:
    enabled: true
    role: dns_portal_api
  go_backend:
    enabled: true
    role: dns_orchestration
  postgres:
    enabled: true
    role: state_audit_zones
  pgbouncer:
    enabled: true
    role: db_pooling

engines:
  authoritative:
    - powerdns_enterprise
    - technitium_dns
    - coredns
    - hickory_dns
    - numadns
  recursive:
    - unbound
    - smartdns
  edge:
    - dnsdist
  api:
    - godns
    - github_miekg_dns

providers:
  - dnspod_tencent_cloud
  - cloudflare_dns
  - akamai_dns
  - duckdns
  - porkbun
  - caddy_dns
  - letsencrypt_dns01_dnspod
  - fastly
  - cloudflare
  - tencent_cloud

architecture:
  mode: global_dns_mesh
  anycast_ready: true
  health_based_routing: true
  dnssec: true
  ipv4: true
  ipv6: true
  udp53: true
  tcp53: true
  doh: true
  dot: true
  authoritative_and_recursive_separation: true
  provider_failover: true

policy:
  public_recursion: false
  third_party_zone_changes: authorized_only
  provider_credentials_in_git: false
  privileged_dns_mutations_require_approval: true
  audit_dns_mutations: true
  customer_private_records_in_git: false

observability:
  prometheus: true
  grafana_cloud_remote_write: true
  dns_query_metrics: true
  provider_health_metrics: true
  anycast_node_health: true
