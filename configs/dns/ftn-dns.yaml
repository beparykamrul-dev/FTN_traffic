version: 1
service: ftn-dns

roles:
  recursive:
    engine: unbound
    root_hints: true
    dnssec_validation: true
    cache: true
  authoritative:
    engine: coredns_or_authoritative_cluster
    zones_from_control_plane: true
  edge:
    anycast_ready: true
    health_checks: true

listeners:
  dns:
    udp: 53
    tcp: 53
  metrics:
    http: 9153

policy:
  recursion_public: false
  recursion_customer_networks_only: true
  authoritative_public_zones_only: true
  private_records_from_git: false
  dns_changes_require_approval: true
  provider_credentials_in_git: false

observability:
  prometheus: true
  grafana_cloud_remote_write: optional
  labels:
    service: ftn-dns
    plane: dns
    network: ftn
