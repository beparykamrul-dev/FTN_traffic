server:
  verbosity: 1
  interface: 0.0.0.0
  port: 53
  do-ip4: yes
  do-ip6: yes
  do-udp: yes
  do-tcp: yes
  hide-identity: yes
  hide-version: yes
  harden-below-nxdomain: yes
  harden-referral-path: yes
  qname-minimisation: yes
  prefetch: yes
  serve-expired: yes
  cache-min-ttl: 60
  cache-max-ttl: 86400
  rrset-roundrobin: yes
  root-hints: /opt/unbound/etc/unbound/root.hints

  # FTN authoritative zones can be added here as local-zone/local-data
  # or delegated to an internal authoritative DNS cluster.
  # Do not publish private/customer records in this repository.

remote-control:
  control-enable: no

server:
  include: "/opt/unbound/etc/unbound/conf.d/*.conf"
