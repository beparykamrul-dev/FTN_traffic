server:
  verbosity: 1
  interface: 0.0.0.0
  port: 53
  do-ip4: yes
  do-ip6: yes
  do-udp: yes
  do-tcp: yes
  hide-identity: yes
  hide-version: yes
  harden-below-nxdomain: yes
  harden-referral-path: yes
  qname-minimisation: yes
  prefetch: yes
  serve-expired: yes
  cache-min-ttl: 60
  cache-max-ttl: 86400
  rrset-roundrobin: yes
  root-hints: /opt/unbound/etc/unbound/root.hints

# FTN authoritative zones may be delegated to a separate authoritative cluster.
# Keep private/customer records out of Git and inject them from the control plane.

remote-control:
  control-enable: no
