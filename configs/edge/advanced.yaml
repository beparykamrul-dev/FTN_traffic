edge:
  cache:
    engine: apache_traffic_server_compatible
    origin_shield: true
    stale_on_error: true
    cache_purge_requires_approval: true
  transport:
    ipv4: true
    ipv6: true
    http2: true
    http3: integration_required
    tls_verification: true
  health:
    origin_checks: true
    pop_checks: true
    latency: true
    packet_loss: true
  telemetry:
    requests: true
    bytes: true
    cache_hits: true
    origin_latency: true
    status_codes: true
  security:
    customer_traffic_interception: false
    third_party_private_content: authorized_only
    credentials_in_git: false
