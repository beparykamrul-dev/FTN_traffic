version: 1
service: ftn-path-controller
mode: latency_first

measurement:
  probes:
    icmp: true
    tcp: true
    http: true
    dns: true
  intervals_seconds:
    fast: 5
    normal: 30
  metrics:
    rtt_p50_ms: true
    rtt_p95_ms: true
    jitter_ms: true
    packet_loss_percent: true
    availability: true

path_classes:
  - ftn_full_mesh
  - authorized_ix
  - authorized_transit
  - authorized_global_edge
  - authorized_origin_host

selection:
  primary: lowest_healthy_cost
  cost:
    latency_weight: 0.50
    packet_loss_weight: 0.20
    jitter_weight: 0.10
    availability_weight: 0.20
  minimum_availability: 0.999
  maximum_packet_loss_percent: 2
  maximum_p95_latency_ms: 1000
  hysteresis_percent: 10
  hold_down_seconds: 30

migration:
  strategies:
    - ecmp
    - weighted
    - canary
    - failover
    - blue_green
  automatic_rollback: true
  health_gate_required: true
  idempotency_key_required: true
  approval_required_for_route_change: true

provider_pool:
  hosting:
    enabled: true
    role: origin_or_edge
    authorization_required: true
  domain_dns:
    enabled: true
    role: authoritative_or_ddns
    authorization_required: true
  cdn:
    enabled: true
    role: edge_delivery
    authorization_required: true

security:
  secrets_in_git: false
  customer_traffic_interception: false
  unauthorized_third_party_access: deny
  route_mutations_require_approval: true
  provider_mutations_require_approval: true
  audit_required: true
