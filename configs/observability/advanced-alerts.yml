groups:
  - name: ftn-traffic-core
    rules:
      - alert: FTNTrafficDown
        expr: up{job="ftn-traffic"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: FTN traffic control service is unavailable
      - alert: FTNDNSProbeFailure
        expr: ftn_dns_probe_success == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: DNS target health probe is failing
      - alert: FTNHighOriginLatency
        expr: histogram_quantile(0.95, rate(ftn_origin_latency_seconds_bucket[5m])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Origin p95 latency is above 1 second
      - alert: FTNHighErrorRate
        expr: rate(ftn_http_errors_total[5m]) / clamp_min(rate(ftn_http_requests_total[5m]), 1) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: HTTP error rate is above 5 percent
      - alert: FTNCacheHitRatioLow
        expr: ftn_cache_hits_total / clamp_min(ftn_cache_requests_total, 1) < 0.70
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Edge cache hit ratio is below 70 percent
