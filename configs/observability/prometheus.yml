global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: ftn-traffic
    metrics_path: /metrics
    static_configs:
      - targets: ["ftn-traffic:8080"]
        labels:
          service: ftn-traffic
          network: ftn

  - job_name: ftn-dns
    static_configs:
      - targets: ["ftn-dns:9153"]
        labels:
          service: ftn-dns
          network: ftn

# Configure Grafana Cloud with environment variables; never commit credentials.
remote_write:
  - url: ${GRAFANA_CLOUD_PROMETHEUS_URL}
    basic_auth:
      username: ${GRAFANA_CLOUD_USER}
      password: ${GRAFANA_CLOUD_API_KEY}
