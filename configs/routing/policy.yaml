routing:
  mode: provider_neutral
  address_families: [ipv4, ipv6]
  policy:
    rpki_validation: required_for_public_prefixes
    max_prefixes_per_peer: 200000
    graceful_restart: true
    bfd: integration_required
    route_mutations_require_approval: true
    unauthorized_route_changes: deny
  telemetry:
    bgp_sessions: true
    prefix_counts: true
    updates: true
    rpki_state: true
    communities: true
  safety:
    no_customer_traffic_interception: true
    no_private_peer_access_without_authorization: true
    credentials_in_git: false
