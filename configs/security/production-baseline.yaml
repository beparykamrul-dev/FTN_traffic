security:
  control_plane:
    tls_required: true
    private_admin_network: true
    authentication: required
    authorization: least_privilege
    audit_log: required
  secrets:
    git: forbidden
    plaintext_logs: forbidden
    runtime_injection: required
  privileged_operations:
    route_changes: approval_required
    edge_changes: approval_required
    dns_mutations: approval_required
    infrastructure_mutations: approval_required
  network:
    customer_traffic_interception: false
    unauthorized_third_party_access: deny
  observability:
    secret_redaction: required
    immutable_audit: recommended
