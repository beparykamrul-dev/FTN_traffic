---
- name: Configure FTN Proxmox grid nodes
  hosts: pve_nodes
  become: true
  gather_facts: true

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install baseline observability and administration packages
      ansible.builtin.apt:
        name:
          - curl
          - wget
          - git
          - htop
          - ca-certificates
          - prometheus-node-exporter
        state: present

    - name: Ensure node exporter is enabled
      ansible.builtin.systemd:
        name: prometheus-node-exporter
        enabled: true
        state: started

    - name: Create FTN grid configuration directory
      ansible.builtin.file:
        path: /etc/ftn-grid
        state: directory
        owner: root
        group: root
        mode: '0750'

    - name: Record managed-node marker
      ansible.builtin.copy:
        dest: /etc/ftn-grid/managed
        content: "managed_by=FTN_traffic\n"
        owner: root
        group: root
        mode: '0640'
